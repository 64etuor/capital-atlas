# 일일 데이터 갱신 — 파이프라인 재실행 후 파생 3종 재생성(README 재생성 체인),
# sanity 게이트 통과분만 커밋. 파이프라인 자체가 bounded retry(3회 캡)라
# 소스 장애 시 실패 기록 후 진행하며, data:check 실패 시 커밋하지 않는다.
name: Data refresh

on:
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC = 14:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:fetch
      - run: pnpm data:synoptic
      - run: pnpm data:station
      - run: pnpm data:sources
      - run: pnpm data:check
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- public/data; then
            echo "no data changes — skipping commit"
          else
            git config user.name "capital-atlas-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "data: $(date -u +%F) 스냅샷 자동 갱신 (scheduled refresh)"
            git push
          fi
