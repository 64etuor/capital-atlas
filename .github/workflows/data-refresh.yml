# 일일 데이터 갱신 — 파이프라인 재실행 후 파생 3종 재생성(README 재생성 체인),
# sanity 게이트 통과분만 커밋. 파이프라인 자체가 bounded retry(3회 캡)라
# 소스 장애 시 실패 기록 후 진행하며, data:check 실패 시 커밋하지 않는다.
name: Data refresh

on:
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC = 14:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:fetch
      # BIS 은행 회랑 재병합 — assemble이 bilateral을 PIP-only로 재생성하므로
      # 이 단계가 빠지면 은행 데이터 15만 건이 조용히 소실된다 (Phase N fix)
      - run: pnpm data:bis
      # v3 노출·폐합 산출물 — BIS 재병합 뒤 다시 생성해 스테일 파생물을 차단한다.
      - run: pnpm data:exposure
      - run: pnpm data:closure
      - run: pnpm data:synoptic
      - run: pnpm data:station
      # §8 재배분 행렬 — 체인 누락 = 스테일 산출물 (Phase N의 data:bis 교훈)
      - run: pnpm data:flowmatrix
      # Phase P — 사실 테이블·미러 폐합 (체인 누락=스테일, N의 교훈)
      - run: pnpm data:facts
      - run: pnpm data:reconcile
      - run: pnpm data:sources
      - run: pnpm data:check
      # 실질 변경 게이트 (Phase N) — 샤드는 결정론적이라 데이터가 안 바뀌면
      # 바이트가 안 바뀐다. 타임스탬프-전용(index.generated_at 등)이면 커밋 생략.
      - name: Classify changes
        id: changed
        run: pnpm -s data:changed
      - name: Commit refreshed snapshot (+vintage digest)
        if: steps.changed.outputs.substantive == 'true'
        run: |
          pnpm data:vintage
          git config user.name "capital-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: $(date -u +%F) 스냅샷 자동 갱신 (scheduled refresh)"
          git push
